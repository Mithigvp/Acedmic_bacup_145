<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Clean Modern Form</title>
</head>
<body>
    <div class="container">
        <form id="formtype" action="" class="type">
            <div class="info">
                <div class="frm">
                    <label for="name">Name</label>
                    <input class="abc" type="text" placeholder="Enter your name" required>
                </div>
                
                <div class="frm">
                    <label for="email">Email</label>
                    <input class="abc" type="email" placeholder="Enter your email" required>
                </div>
                
                <div class="frm">
                    <label for="phone_no">Phone Number</label>
                    <input class="abc" type="number" placeholder="Enter your phone number" required>
                </div>
                
                <div class="frm">
                    <label for="address">Address</label>
                    <input class="abc" type="text" placeholder="Enter your address" required>
                </div>
                
                <div class="acd">
                    <div class="frm">
                        <label for="country">Country</label>
                       
                        <input class="abc" type="text" placeholder="Enter your country">
                    </div>
                    <div class="frm">
                        <label for="state">State</label>
                        <input class="abc" type="text" placeholder="Enter your state">
                    </div>
                </div>
                
                <div class="frm">
                    <label for="pincode">Pincode</label>
                    <input class="abc" type="number" placeholder="Enter your pincode">
                </div>
            </div>
            
            <div class="btn">
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>
</body>
</html>
